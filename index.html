<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geohash Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <h1>Geohash Viewer</h1>

    <label>Geohash
      <input id="hash" type="text" placeholder="e.g. u0nd9" autocomplete="off" spellcheck="false">
    </label>

    <label>Precision: <b id="precLabel">3</b>
      <input id="precision" type="range" min="1" max="12" value="3">
    </label>

    <div id="info"></div>

    <h2>Neighbours</h2>
    <div id="grid"></div>
    <p class="hint">Arrows / WASD to move (Q E Z C for diagonals).<br>
      Click the map to select. <kbd>+</kbd>/<kbd>-</kbd> changes precision.</p>

    <h2>Options</h2>
    <label class="chk"><input id="showParent" type="checkbox" checked> Show parent</label>
    <label class="chk"><input id="showGrid" type="checkbox"> Grid in view</label>
    <label class="chk"><input id="follow" type="checkbox" checked> Follow selection</label>

    <div class="legend">
      <span><i class="sw sel"></i>selected</span>
      <span><i class="sw same"></i>neighbour, same parent</span>
      <span><i class="sw diff"></i>neighbour, different parent</span>
      <span><i class="sw par"></i>parent</span>
    </div>
    <footer>by Olly</footer>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
