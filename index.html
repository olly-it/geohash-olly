<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geohash Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <h1>Geohash Viewer</h1>

    <label>Geohash
      <input id="hash" type="text" placeholder="es. u0nd9" autocomplete="off" spellcheck="false">
    </label>

    <label>Precisione: <b id="precLabel">5</b>
      <input id="precision" type="range" min="1" max="12" value="5">
    </label>

    <div id="info"></div>

    <h2>Vicini</h2>
    <div id="grid"></div>
    <p class="hint">Frecce / WASD per muoversi (Q E Z C per le diagonali).<br>
      Click sulla mappa per selezionare. <kbd>+</kbd>/<kbd>-</kbd> cambia precisione.</p>

    <h2>Opzioni</h2>
    <label class="chk"><input id="showParent" type="checkbox" checked> Mostra padre</label>
    <label class="chk"><input id="showGrid" type="checkbox"> Griglia nella vista</label>
    <label class="chk"><input id="follow" type="checkbox" checked> Segui selezione</label>

    <div class="legend">
      <span><i class="sw sel"></i>selezionata</span>
      <span><i class="sw same"></i>vicino, stesso padre</span>
      <span><i class="sw diff"></i>vicino, padre diverso</span>
      <span><i class="sw par"></i>padre</span>
    </div>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
